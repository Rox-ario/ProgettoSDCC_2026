name: Build, Push and Deploy Worker to ACI

on:
  push:
    branches:
      - master
    paths:
      - 'worker/**'
  workflow_dispatch:

env:
  REGISTRY_LOGIN_SERVER: ${{ secrets.REGISTRY_USERNAME }}.azurecr.io
  IMAGE_NAME: orfeo-worker-ai

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Delete existing ACI (if present)
        run: |
          az container delete \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name orfeo-worker-instance \
            --yes || echo "Container non esistente, si procede."

      - name: Create ACI with new image and environment variables
        run: |
          az container create \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name orfeo-worker-instance \
            --image "${{ env.REGISTRY_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest" \
            --registry-login-server "${{ env.REGISTRY_LOGIN_SERVER }}" \
            --registry-username "${{ secrets.REGISTRY_USERNAME }}" \
            --registry-password "${{ secrets.REGISTRY_PASSWORD }}" \
            --os-type Linux \
            --cpu 1 \
            --memory 4 \
            --restart-policy Never \
            --environment-variables \
              QUEUE_NAME=video-processing-queue \
              BLOB_CONTAINER_NAME=multimedia-contents \
              TABLE_NAME=MediaMetadata \
            --secure-environment-variables \
              "AZURE_STORAGE_CONNECTION_STRING=${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}"

      - name: Attendi avvio e cattura i log del container
        run: |
          echo "Attendo 90 secondi per dare tempo al container di avviarsi..."
          sleep 90
          echo "=== LOG DEL CONTAINER ==="
          az container logs \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name orfeo-worker-instance \
            || echo "Nessun log disponibile"